{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}{{ action }} Event - FitConnect{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <h2><i class="bi bi-calendar-plus"></i> {{ action }} Event</h2>
    <div class="card shadow-sm mt-3">
      <div class="card-body p-4">
        <form method="post">
          {% csrf_token %}
          {{ form|crispy }}
          <div class="d-flex gap-2 mt-3">
            <button type="submit" class="btn btn-success">{{ action }} Event</button>
            <a href="/events/" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
