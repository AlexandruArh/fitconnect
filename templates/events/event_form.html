{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}{{ action }} Event — FitConnect{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="card">
      <div class="card-header fw-semibold">
        <i class="bi bi-{% if action == 'Create' %}plus-circle{% else %}pencil{% endif %}"></i>
        {{ action }} Event
      </div>
      <div class="card-body">
        <form method="post" novalidate>
          {% csrf_token %}
          {{ form|crispy }}
          <div class="d-flex justify-content-between mt-3">
            <a href="{% url 'events:list' %}" class="btn btn-outline-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">{{ action }} Event</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
