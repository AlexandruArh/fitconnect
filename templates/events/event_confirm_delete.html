{% extends 'base.html' %}
{% block title %}Delete Event - FitConnect{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 text-center">
    <div class="card border-danger shadow-sm">
      <div class="card-body p-4">
        <i class="bi bi-exclamation-triangle-fill text-danger fs-1"></i>
        <h3 class="mt-3">Delete "{{ event.title }}"?</h3>
        <p class="text-muted">This action cannot be undone. All RSVPs for this event will also be removed.</p>
        <form method="post">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger me-2">Yes, Delete</button>
          <a href="/events/{{ event.pk }}/" class="btn btn-outline-secondary">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
