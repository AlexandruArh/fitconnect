{% extends 'base.html' %}
{% block title %}Delete Event — FitConnect{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card border-danger">
      <div class="card-header bg-danger text-white fw-semibold">
        <i class="bi bi-exclamation-triangle"></i> Confirm Delete
      </div>
      <div class="card-body">
        <p>Are you sure you want to delete <strong>{{ event.title }}</strong>?</p>
        <p class="text-muted small">This will remove the event and all RSVPs permanently.</p>
        <form method="post">
          {% csrf_token %}
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-danger"><i class="bi bi-trash"></i> Yes, Delete</button>
            <a href="{% url 'events:detail' event.pk %}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
