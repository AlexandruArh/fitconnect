{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}Register — FitConnect{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card">
      <div class="card-header fw-semibold"><i class="bi bi-person-plus"></i> Create Account</div>
      <div class="card-body">
        <form method="post" novalidate>
          {% csrf_token %}
          {{ form|crispy }}
          <button type="submit" class="btn btn-primary w-100 mt-2">Register</button>
        </form>
        <hr>
        <p class="text-center mb-0 small">Already have an account? <a href="{% url 'accounts:login' %}">Login here</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
