{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}Register - FitConnect{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h2 class="card-title mb-4"><i class="bi bi-person-plus"></i> Create Account</h2>
        <form method="post">
          {% csrf_token %}
          {{ form|crispy }}
          <button type="submit" class="btn btn-success w-100 mt-2">Register</button>
        </form>
        <p class="mt-3 text-center">Already have an account? <a href="/accounts/login/">Login</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
