{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}Login - FitConnect{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h2 class="card-title mb-4"><i class="bi bi-box-arrow-in-right"></i> Login</h2>
        <form method="post">
          {% csrf_token %}
          {{ form|crispy }}
          <button type="submit" class="btn btn-success w-100 mt-2">Login</button>
        </form>
        <p class="mt-3 text-center">Don't have an account? <a href="/accounts/register/">Register</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
