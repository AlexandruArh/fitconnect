{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}Login — FitConnect{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card">
      <div class="card-header fw-semibold"><i class="bi bi-box-arrow-in-right"></i> Login</div>
      <div class="card-body">
        <form method="post" novalidate>
          {% csrf_token %}
          {{ form|crispy }}
          <button type="submit" class="btn btn-primary w-100 mt-2">Login</button>
        </form>
        <hr>
        <p class="text-center mb-0 small">Don't have an account? <a href="{% url 'accounts:register' %}">Register here</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
